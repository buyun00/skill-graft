# Skill Graft is one ordinary DSH bundle row. The Connection dependency is a
# service gate, not a transport shortcut: all business commands still enter
# the shared Application command bus through the package-private RPC channel.
- insert:
    - id: skill-graft-dsh
      name: '@ozdqp/skill-graft-dsh'
      inject: [connection]
      config:
        dataRoot: !!js dshHomePath('skill-graft')
        workspace: ''
        autoSync: off
        lockTimeoutMs: 30000
        logLevel: info
